<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TeamsGroupSentry</title><link rel="stylesheet" href="popup.css"></head><body>
<header><div class="tiny">TEAMSGROUPSENTRY · V1.0.0</div><h1>Teams 群组安全哨兵</h1><p>本地观察 · 人员关系网 · 人工审核</p></header>
<section id="alertBanner" class="alert-banner" role="status" aria-live="polite" hidden>
 <strong id="alertTitle">⚠ 有待核查事项</strong><span id="alertDetail">请查看下方红色卡片并处理。</span>
</section>
<section id="healthBanner" class="health-banner" role="status" aria-live="polite" hidden><strong>⚠ 守护状态需要关注</strong><span id="healthDetail"></span></section>
<section class="grid" aria-label="安全总览快速入口"><button type="button" class="stat-link" data-destination="groups" id="statGroups" aria-label="查看全部群组明细"><b id="groups">—</b><span id="groupsLabel">已索引群组</span><small>查看群组 →</small></button><button type="button" class="stat-link" data-destination="people" id="statPeople" aria-label="查看全部唯一人员明细"><b id="persons">—</b><span id="personsLabel">唯一人员</span><small>查看人员 →</small></button><button type="button" class="stat-link" data-destination="review" id="statUnknown" aria-label="查看新身份待审核名单"><b id="unknown">—</b><span id="unknownLabel">新身份待审</span><small>前往审核 →</small></button><button type="button" class="stat-link" data-destination="events" id="statEvents" aria-label="查看重要未处理事件"><b id="events">—</b><span id="eventsLabel">重要未处理</span><small>查看事件 →</small></button></section>
<p class="hint" id="status" role="status" aria-live="polite">正在读取扩展数据库…</p>
<section id="identityAction" class="identity-action" hidden>
  <strong>账号保护：需要确认绑定</strong>
  <p id="identityExplanation">只读扫描不会修改既有基线。确认是当前 Teams 账号后，可以继续建立或沿用正式群组索引。</p>
  <button id="bindCurrent" class="primary">确认当前账号并建立 / 沿用基线</button>
</section>
<p id="scanFeedback" class="feedback" role="status" aria-live="polite" hidden></p>
<div class="actions"><button id="scan" class="primary">立即巡检</button><button id="dashboard">打开人员安全中心</button><button id="nameCurrent">识别当前 Teams 群并命名</button><button id="upgradeSafety">数据升级保护与备份</button></div>
<section class="overlay-opt"><label for="overlayMode">Teams 网页右上角状态栏</label><select id="overlayMode"><option value="always">始终显示</option><option value="alerts">仅有异常时显示</option><option value="hidden">完全隐藏</option></select><span id="overlayNote">修改后会同步到 Teams 网页</span></section>
<footer>不持久保存原始鉴权凭据；缓存新增 ID 不等于服务端确认入群。</footer>
<script src="popup.js"></script></body></html>
