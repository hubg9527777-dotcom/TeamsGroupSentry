name: Build TeamsGroupSentry v1.0.2

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: npm test

      - name: Build ZIP packages
        run: python3 tests/build-packages.py dist

      - name: Verify packages
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt

      - name: Upload ZIP packages
        uses: actions/upload-artifact@v4
        with:
          name: TeamsGroupSentry-v1.0.2
          path: |
            dist/TeamsGroupSentry-1.0.2-install.zip
            dist/TeamsGroupSentry-1.0.2-source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
