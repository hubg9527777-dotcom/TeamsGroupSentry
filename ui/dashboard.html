<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TeamsGroupSentry · 人员安全中心</title><link rel="stylesheet" href="dashboard.css"></head>
<body>
<header class="topbar"><div class="brand"><img src="../icons/icon48.png" alt=""><div><div class="micro">TEAMSGROUPSENTRY · LOCAL ONLY · V1.0.1</div><h1>Teams 人员安全中心</h1></div></div><div class="head-actions"><span id="syncState" class="subtle">正在加载本地数据…</span><button id="scan" class="btn primary">立即巡检</button><button id="openTeams" class="btn">打开 Teams</button></div></header>
<div class="warning" id="systemWarning" role="status"></div>
<div class="layout">
<nav class="sidebar" aria-label="主导航">
  <button data-page="overview" class="nav active">◉ 首页</button>
  <button data-page="groups" class="nav">▤ 群组管理</button>
  <button data-page="people" class="nav">♙ 人员管理</button>
  <button data-page="relations" class="nav">⇄ 群与人员</button>
  <button data-page="review" class="nav">✓ 新人员审核 <span id="reviewCount" class="count"></span></button>
  <button data-page="requests" class="nav">⚠ 陌生好友 / 联系请求 <span id="requestCount" class="count"></span></button>
  <button data-page="events" class="nav">△ 事件记录</button>
  <button data-page="settings" class="nav">⚙ 设置与备份</button>
  <div class="sidebar-bottom">数据保存在当前浏览器。<p>缓存变动 ≠ 服务端确认入群。</p></div>
</nav>
<main id="main" class="main"></main>
</div>
<aside id="detail" class="detail hidden" aria-label="详细信息"><div class="detailhead"><h2 id="detailTitle">详情</h2><button id="closeDetail" class="btn iconbtn" aria-label="关闭">×</button></div><div id="detailBody" class="detailbody"></div></aside>
<div id="toast" class="toast hidden" role="status"></div>
<script src="../lib/logic.js"></script><script src="../lib/name-core.js"></script><script src="../lib/contact-risk.js"></script><script src="../lib/db.js"></script><script src="../lib/backup-envelope.js"></script><script src="dashboard.js"></script>
</body></html>
